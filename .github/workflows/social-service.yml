name: Build Social Service

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Checkout del código
    - name: Checkout repository
      uses: actions/checkout@v3

    # 2️⃣ Ejecutar tests (placeholder)
    - name: Build and run tests
      run: echo "tests to be developed"
      working-directory: ./SocialMicroservice
        

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build with Maven
      run: mvn clean package -DskipTests
      working-directory: ./SocialMicroservice

    # 3️⃣ Configurar Docker Buildx
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    # 4️⃣ Construir la imagen Docker
    - name: Build Docker image
      run: |
        docker build -t rob040404/social-service:latest ./SocialMicroservice
        docker tag rob040404/social-service:latest rob040404/social-service:${{ github.sha }}
