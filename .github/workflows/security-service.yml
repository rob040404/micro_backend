name: Build Security Service

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Checkout del código
    - name: Checkout repository
      uses: actions/checkout@v3

    # 2️⃣ Ejecutar tests (placeholder)
    - name: Run tests (if any)
      run: |
        echo "Aquí puedes agregar comandos para ejecutar tests de Java"

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build with Maven
      run: mvn clean package -DskipTests
      working-directory: ./security

    # 3️⃣ Configurar Docker Buildx
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    # 4️⃣ Construir la imagen Docker
    - name: Build Docker image
      run: |
        docker build -t rob040404/security-service:latest ./security
        docker tag rob040404/security-service:latest rob040404/security-service:${{ github.sha }}
