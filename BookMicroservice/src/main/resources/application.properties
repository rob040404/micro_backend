spring.application.name=BookMicroservice
server.port=9002
#spring.datasource.url=jdbc:mysql://localhost:3306/BPlot_books
#Para conectar a traves de Docker
#spring.datasource.url=jdbc:mysql://mysql-books:3306/BPlot_books
#spring.datasource.username=root
#spring.datasource.password=0407
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.jdbc.datasource.init=DEBUG


javamelody.enabled=true
javamelody.excluded-datasources=secretSource,topSecretSource
javamelody.spring-monitoring-enabled=true
javamelody.init-parameters.log=true
#lo que se excluye de url
javamelody.init-parameters.url-exclude-pattern=(/webjars/.*|/css/.*|/images/.*|/fonts/.*|/js/.*)
# javamelody.init-parameters.authorized-users=admin:pwd
#  to change the default "/monitoring" path:
# javamelody.init-parameters.monitoring-path=/admin/performance
javamelody.url-pattern=/monitoring/*

# Subida de ficheros
upload.root-location=upload-dir

#Habilitar trace en logs
logging.level.com.book.BookMicroservice=TRACE

#Referencia al otro properties de las claves
spring.profiles.active=local

#app.books.books_apikey=${BOOKS_APIKEY}
#app.security.bplot_apikey=${BPLOT_APIKEY}

logging.file.name = books-logs
