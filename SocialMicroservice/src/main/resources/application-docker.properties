app.security.blot.apikey=${APP_SECURITY_BLOT_APIKEY_SECRET}
app.users.users.apikey=${APP_USERS_USERS_APIKEY_SECRET}
app.users.users.api_url=${APP_USERS_USERS_API_URL_SECRET}
app.social.social.apikey=${APP_SOCIAL_SOCIAL_APIKEY_SECRET}
app.social.social.header=${APP_SOCIAL_SOCIAL_HEADER_SECRET}

spring.datasource.url=jdbc:mysql://mysql:3306/BPlot_social
spring.datasource.username=${DB_USERNAME_SECRET}
spring.datasource.password=${DB_PASSWORD_SECRET}

# === Kafka general ===
#Server and port of Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}

# Spring creates the topics automatically if we do not do it
spring.kafka.admin.auto-create=true

# === Topic (from ENV) ===
topic.follow-requests=${KAFKA_FOLLOW_REQUEST_TOPIC}
topic.follow-answers=${KAFKA_FOLLOW_ANSWER_TOPIC}

# It reduces the logs of Kafka to the minimum (erors)
logging.level.org.apache.kafka=ERROR
logging.level.org.springframework.kafka=ERROR


#Redis
spring.redis.host=${REDIS_HOST}
spring.redis.port=${REDIS_PORT}
spring.cache.type=${CACHE_TYPE}
spring.cache.redis.time-to-live=${TIME_TO_LIVE}


# ========================================
# RESILIENCE4J - CIRCUIT BREAKER
# ========================================

# Register health indicator to monitor circuit breaker state
resilience4j.circuitbreaker.instances.kafkaProducer.registerHealthIndicator=true

# Sliding window size (number of calls to calculate failure rate)
resilience4j.circuitbreaker.instances.kafkaProducer.slidingWindowSize=10

# Minimum number of calls before calculating failure rate
resilience4j.circuitbreaker.instances.kafkaProducer.minimumNumberOfCalls=5

# Number of calls allowed when circuit is in HALF_OPEN state
resilience4j.circuitbreaker.instances.kafkaProducer.permittedNumberOfCallsInHalfOpenState=3

# Automatic transition from OPEN to HALF_OPEN after wait duration
resilience4j.circuitbreaker.instances.kafkaProducer.automaticTransitionFromOpenToHalfOpenEnabled=true

# Wait duration in OPEN state before transitioning to HALF_OPEN (in seconds)
resilience4j.circuitbreaker.instances.kafkaProducer.waitDurationInOpenState=10s

# Failure rate threshold to open the circuit (50%)
resilience4j.circuitbreaker.instances.kafkaProducer.failureRateThreshold=50

# Event consumer buffer size
resilience4j.circuitbreaker.instances.kafkaProducer.eventConsumerBufferSize=10

# Exceptions that are recorded as failures
resilience4j.circuitbreaker.instances.kafkaProducer.recordExceptions[0]=org.springframework.kafka.KafkaException
resilience4j.circuitbreaker.instances.kafkaProducer.recordExceptions[1]=java.util.concurrent.TimeoutException

# ========================================
# RESILIENCE4J - RETRY
# ========================================

# Maximum number of retry attempts (including initial attempt)
resilience4j.retry.instances.kafkaProducer.maxAttempts=3

# Wait duration between retry attempts
resilience4j.retry.instances.kafkaProducer.waitDuration=2s

# Enable exponential backoff
resilience4j.retry.instances.kafkaProducer.enableExponentialBackoff=true

# Exponential backoff multiplier (each retry waits double the previous time)
resilience4j.retry.instances.kafkaProducer.exponentialBackoffMultiplier=2

# Exceptions that trigger a retry
resilience4j.retry.instances.kafkaProducer.retryExceptions[0]=org.springframework.kafka.KafkaException
resilience4j.retry.instances.kafkaProducer.retryExceptions[1]=org.apache.kafka.common.errors.TimeoutException

# ========================================
# RESILIENCE4J - TIME LIMITER
# ========================================

# Timeout for operations (in seconds)
resilience4j.timelimiter.instances.kafkaProducer.timeoutDuration=5s


# ========================================
# ADDITIONAL OPTIONAL CONFIGURATION
# ========================================

# Cancel running operations that exceed timeout
# resilience4j.timelimiter.instances.kafkaProducer.cancelRunningFuture=true

# Sliding window type: COUNT_BASED (default) or TIME_BASED
# resilience4j.circuitbreaker.instances.kafkaProducer.slidingWindowType=COUNT_BASED

# Slow call rate threshold (optional)
# resilience4j.circuitbreaker.instances.kafkaProducer.slowCallRateThreshold=100
# resilience4j.circuitbreaker.instances.kafkaProducer.slowCallDurationThreshold=60s

# Exceptions that are NOT recorded as failures (ignored)
# resilience4j.circuitbreaker.instances.kafkaProducer.ignoreExceptions[0]=com.social.SocialMicroservice.exceptions.BusinessException